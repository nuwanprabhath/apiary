# Builds installable artifacts and attaches them to a GitHub Release whenever a `v*` tag is
# pushed. Each OS/arch builds natively on its own runner rather than cross-compiling.
#
# No macOS x64 leg: GitHub has been winding down Intel Mac (macos-13) hosted runners, and on
# the v1.0.0 release run that job sat queued for 10+ minutes without a runner ever picking it
# up, while the other two legs started within seconds — not worth carrying a leg that may not
# reliably run. Intel Mac users are covered by the README's build-from-source path instead
# (`npm run dist:mac:x64`), which the Packaging section already documents can hit a
# `distutils`/node-gyp cross-compile gap on an arm64 dev machine specifically — not an issue
# here, since a real x64 runner (were one available) would compile natively, but it's the same
# reason that local path is opt-in rather than the default `npm run dist`.
#
# The `latest-*.yml` files uploaded alongside the installers are what the in-app updater reads to
# discover a new version — a release without them is invisible to every installed copy of the app.
# They are generated by electron-builder because electron-builder.yml declares a `publish` provider.
#
# Deliberately narrower than local `npm test`: this runs `vitest`, typecheck and lint only, not
# Playwright's E2E suite, which needs a virtual display on Linux and a real `claude` binary on
# PATH that a CI runner won't have. E2E stays a local/manual gate before tagging a release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon — native arm64 build
            script: dist:mac:arm64
            artifacts: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
          - os: ubuntu-24.04
            script: dist:linux
            artifacts: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run typecheck

      # The shellcheck package downloads its binary from GitHub's API, which rate-limits anonymous
      # requests on shared runners — the token lifts that.
      - run: npm run lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm test

      - run: npm run ${{ matrix.script }}

      # Appends to the same release across all three matrix legs (softprops/action-gh-release
      # creates the release from the pushed tag on its first run and adds assets on each
      # subsequent one), so the finished release ends up with all platforms' artifacts together.
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifacts }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
