# Builds installable artifacts and attaches them to a GitHub Release whenever a `v*` tag is
# pushed. Each OS/arch builds natively on its own runner rather than cross-compiling.
#
# Three stages, so a `contents: write` token is only ever handed to the last one, which runs no
# npm code (SEC-4): `verify` (typecheck, lint, unit/integration, component, and that the tag
# matches package.json) -> `build` matrix (native `dist:*`, uploaded as artifacts, cancelling the
# other leg on first failure) -> `publish` (downloads the artifacts and attaches them to the
# release in one call). A failure in `verify` or either `build` leg means `publish` never runs, so
# a release goes out whole or not at all (TEST-13) — no leg uploads straight to the release itself
# any more.
#
# No macOS x64 leg: GitHub has been winding down Intel Mac (macos-13) hosted runners, and on
# the v1.0.0 release run that job sat queued for 10+ minutes without a runner ever picking it
# up, while the other two legs started within seconds — not worth carrying a leg that may not
# reliably run. Intel Mac users are covered by the README's build-from-source path instead
# (`npm run dist:mac:x64`), which the Packaging section already documents can hit a
# `distutils`/node-gyp cross-compile gap on an arm64 dev machine specifically — not an issue
# here, since a real x64 runner (were one available) would compile natively, but it's the same
# reason that local path is opt-in rather than the default `npm run dist`.
#
# The `latest-*.yml` files uploaded alongside the installers are what the in-app updater reads to
# discover a new version — a release without them is invisible to every installed copy of the app.
# They are generated by electron-builder because electron-builder.yml declares a `publish` provider.
#
# Deliberately narrower than local `npm test`: this runs vitest, typecheck and lint only, not
# Playwright's E2E suite, which needs a virtual display on Linux and a real `claude` binary on
# PATH that a CI runner won't have. E2E stays a local/manual gate before tagging a release (see
# ci.yml's `e2e-smoke` job for the automated subset that *can* run without either).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  # Not cancel-in-progress: a release build should run to completion (or failure) rather than be
  # cut off by a second tag push.
  group: release-${{ github.ref }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - run: npm ci

      # `npm audit` at every severity (scripts/audit.mjs) as a pre-release gate, dev dependencies included (see
      # SEC-1: `--omit=dev` hid Electron's own CVEs). Runs before any build spends time.
      - run: npm run audit

      - run: npm run typecheck

      # shellcheck ships preinstalled on GitHub's ubuntu runners, but pin the install explicitly
      # rather than depend on that staying true.
      - run: command -v shellcheck || sudo apt-get update && sudo apt-get install -y shellcheck

      - run: npm run lint

      - run: npm test

      # Component tests run the renderer in headless Chromium, which `npm ci` does not download.
      # No browser cache here on purpose: a release builds from a clean slate.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:component

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - os: macos-14 # Apple Silicon — native arm64 build
            script: dist:mac:arm64
            artifacts: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
          - os: ubuntu-24.04
            script: dist:linux
            artifacts: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # macOS is the only leg ci.yml's ubuntu-only `test` job never covers — real pty, codesign,
      # `/private/var` realpath and zsh behaviour only run here, before the tag's artifacts ship.
      - name: Native unit/integration suite (macOS only)
        if: runner.os == 'macOS'
        run: npm test

      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No checkout, no npm install, no third-party build step: the write token below is only
      # ever in scope for the two steps that need it.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true

      - name: Attach release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/**
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
