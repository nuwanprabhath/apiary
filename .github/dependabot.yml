version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      electron:
        patterns:
          - "electron*"
          - "@electron/*"
      vitest:
        patterns:
          - "vitest*"
          - "@vitest/*"
      eslint:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
      build:
        patterns:
          - "vite*"
          - "@vitejs/*"
    ignore:
      # electron-vite 5 (the latest) peers on vite ^5 || ^6 || ^7, and @vitejs/plugin-react 6
      # needs vite 8. Lift this once electron-vite supports Vite 8.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
