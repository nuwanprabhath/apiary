name: Set up Node and dependencies
description: Node 22, a cache of the Electron downloads, and `npm ci` retried on a transient failure.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
        key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: npm ci (3 attempts, 20 s apart)
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if npm ci; then exit 0; fi
          if [ "$attempt" -lt 3 ]; then
            echo "npm ci failed (attempt $attempt of 3); retrying in 20 s"
            sleep 20
          fi
        done
        exit 1
