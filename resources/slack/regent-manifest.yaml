display_information:
  name: Regent
  description: Talk to Apiary's Regent from a Slack channel.
features:
  bot_user:
    display_name: regent
    always_online: false
oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - chat:write
      - reactions:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
