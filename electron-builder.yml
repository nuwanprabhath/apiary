appId: dev.apiary.app
productName: Apiary
# electron-builder auto-publishes to GitHub Releases on its own whenever it detects a git tag
# checked out (regardless of whether this file declares a `publish:` target at all) and then
# fails outright without a GH_TOKEN it has no way to know is intentionally absent — the actual
# upload is handled by a separate step in .github/workflows/release.yml instead, so this must be
# `never` or every one of that workflow's three matrix legs fails right after packaging.
publish: never
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  # Packaged so the runtime can set the window icon from inside the asar (Linux/Windows —
  # macOS takes its icon from the bundle). See createWindow() in src/main/index.ts.
  - build/icon.png
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/node-pty/**"
afterPack: build/afterPack.cjs
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
linux:
  category: Development
  icon: build/icons
  maintainer: Nuwan Munasinghe <nuwanprabhath@gmail.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
